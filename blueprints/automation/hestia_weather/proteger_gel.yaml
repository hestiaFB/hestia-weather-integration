blueprint:
  name: Hestia Weather · Protéger avant le gel
  description: >-
    La veille au soir, si Hestia Weather annonce du gel : un rappel avec la liste de ce qu’il faut rentrer,
    le givre sur le pare-brise s’il est prévu, et vos actions (hors-gel, chauffage de la serre…).
  domain: automation
  source_url: https://github.com/hestiaFB/hestia-weather-integration/blob/main/blueprints/automation/hestia_weather/proteger_gel.yaml
  homeassistant:
    min_version: "2025.1.0"
  input:
    gel:
      name: Capteur de gel
      selector:
        entity:
          filter:
            integration: hestia_weather
            domain: binary_sensor
    givre:
      name: Givre sur le pare-brise (facultatif)
      description: Activez d’abord l’entité « Givre sur le pare-brise » (désactivée par défaut) si vous voulez ce rappel.
      default: ""
      selector:
        entity:
          filter:
            integration: hestia_weather
            domain: binary_sensor
    heure:
      name: Heure du rappel
      default: "19:00:00"
      selector:
        time:
    a_rentrer:
      name: À rentrer ou à protéger
      description: Une ligne par chose, par exemple « le citronnier », « les géraniums ».
      default: []
      selector:
        text:
          multiple: true
    telephones:
      name: Téléphones
      description: Les téléphones qui ont l’application Home Assistant.
      default: []
      selector:
        device:
          multiple: true
          filter:
            - integration: mobile_app
    icone:
      name: Icône sur le téléphone (facultatif)
      description: Android seulement. Laissée vide, Hestia choisit une icône selon le message.
      default: ""
      selector:
        icon:
    camera:
      name: Image d’une caméra (facultatif)
      description: Une image de cette caméra, prise à l’envoi, est jointe au message sur les téléphones (la vue du jardin, du ciel…).
      default: ""
      selector:
        entity:
          filter:
            - domain: camera
    lien:
      name: Page à ouvrir (facultatif)
      description: La page qui s’ouvre quand on touche le message, par exemple /lovelace/meteo. Laissée vide, l’application s’ouvre normalement.
      default: ""
      selector:
        text:
    enceintes:
      name: Enceintes (facultatif)
      description: Le message y est lu à voix haute, avec la voix choisie juste en dessous.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: media_player
    voix:
      name: Voix des enceintes
      description: Par exemple « Google Translate » ou « Home Assistant Cloud ».
      default: ""
      selector:
        entity:
          filter:
            - domain: tts
    notifier:
      name: Autres notifications (facultatif)
      description: Un groupe comme notify.famille, à taper ; vos réglages d’avant sont gardés ici.
      default: []
      selector:
        text:
          multiple: true
    en_plus:
      name: Autres actions (facultatif)
      description: Mettre le hors-gel, chauffer la serre… La variable texte contient le message.
      default: []
      selector:
        action:

mode: single

triggers:
  - trigger: time
    at: !input heure

variables:
  gel: !input gel
  givre: !input givre
  a_rentrer: !input a_rentrer
  notifier: !input notifier
  telephones: !input telephones
  icone: !input icone
  camera: !input camera
  lien: !input lien
  # What the Home Assistant app shows with the message: its tag, its icon, a camera's image, the page it opens.
  donnees: >-
    {% set d = {'tag': 'hestia_weather_gel_rappel', 'notification_icon': icone or 'mdi:snowflake-alert'} %}
    {% if camera %}{% set d = dict(d, image='/api/camera_proxy/' ~ camera) %}{% endif %}
    {% if lien %}{% set d = dict(d, clickAction=lien, url=lien) %}{% endif %}
    {{ d }}
  enceintes: !input enceintes
  voix: !input voix
  liste: "{{ a_rentrer | join(', ') }}"
  texte: >-
    {{ state_attr(gel, 'raison') }}.
    {%- if liste %} Pensez à rentrer : {{ liste }}.{% endif %}
    {%- if givre and is_state(givre, 'on') %} Givre sur le pare-brise demain matin.{% endif %}

conditions:
  - condition: template
    value_template: "{{ is_state(gel, 'on') }}"

actions:
  - repeat:
      for_each: "{{ telephones }}"
      sequence:
        - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
          continue_on_error: true
          data:
            title: Gel cette nuit
            message: "{{ texte }}"
            data: "{{ donnees }}"
  - repeat:
      for_each: "{{ notifier }}"
      sequence:
        - action: "{{ repeat.item }}"
          continue_on_error: true
          data:
            title: Gel cette nuit
            message: "{{ texte }}"
            data:
              tag: hestia_weather_gel_rappel
  - if:
      - condition: template
        value_template: "{{ enceintes | count > 0 and voix != '' }}"
    then:
      - action: tts.speak
        continue_on_error: true
        target:
          entity_id: "{{ voix }}"
        data:
          media_player_entity_id: "{{ enceintes }}"
          message: "{{ texte }}"
  - choose: []
    default: !input en_plus
