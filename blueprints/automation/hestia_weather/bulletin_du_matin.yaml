blueprint:
  name: Hestia Weather · Le bulletin du matin
  description: >-
    À l’heure du réveil, le bulletin du jour de Hestia Weather et la vigilance en cours, sur vos téléphones
    ou en annonce vocale.
  domain: automation
  source_url: https://github.com/hestiaFB/hestia-weather-integration/blob/main/blueprints/automation/hestia_weather/bulletin_du_matin.yaml
  homeassistant:
    min_version: "2025.1.0"
  input:
    en_bref:
      name: Capteur « En bref »
      selector:
        entity:
          filter:
            integration: hestia_weather
            domain: sensor
    vigilance:
      name: Vigilance (facultatif)
      default: ""
      selector:
        entity:
          filter:
            integration: hestia_weather
            domain: sensor
    heure:
      name: Heure
      default: "07:00:00"
      selector:
        time:
    jours:
      name: Jours
      default: [mon, tue, wed, thu, fri, sat, sun]
      selector:
        select:
          multiple: true
          options:
            - { value: mon, label: Lundi }
            - { value: tue, label: Mardi }
            - { value: wed, label: Mercredi }
            - { value: thu, label: Jeudi }
            - { value: fri, label: Vendredi }
            - { value: sat, label: Samedi }
            - { value: sun, label: Dimanche }
    telephones:
      name: Téléphones
      description: Les téléphones qui ont l’application Home Assistant.
      default: []
      selector:
        device:
          multiple: true
          filter:
            - integration: mobile_app
    enceintes:
      name: Enceintes (facultatif)
      description: Le message y est lu à voix haute, avec la voix choisie juste en dessous.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: media_player
    voix:
      name: Voix des enceintes
      description: Par exemple « Google Translate » ou « Home Assistant Cloud ».
      default: ""
      selector:
        entity:
          filter:
            - domain: tts
    notifier:
      name: Autres notifications (facultatif)
      description: Un groupe comme notify.famille, à taper ; vos réglages d’avant sont gardés ici.
      default: []
      selector:
        text:
          multiple: true
    en_plus:
      name: Autres actions (facultatif)
      description: Une annonce vocale par exemple. La variable texte contient le bulletin.
      default: []
      selector:
        action:

mode: single

triggers:
  - trigger: time
    at: !input heure

variables:
  en_bref: !input en_bref
  vigilance: !input vigilance
  notifier: !input notifier
  telephones: !input telephones
  enceintes: !input enceintes
  voix: !input voix
  bulletin: "{{ state_attr(en_bref, 'bulletin') or state_attr(en_bref, 'summary') or states(en_bref) }}"
  alerte: >-
    {%- set v = states(vigilance) if vigilance else 'unknown' -%}
    {{ state_attr(vigilance, 'raison') if v in ['jaune', 'orange', 'rouge'] else '' }}
  texte: "{{ bulletin }}{{ ' ' ~ alerte ~ '.' if alerte else '' }}"

conditions:
  - condition: time
    weekday: !input jours

actions:
  - repeat:
      for_each: "{{ telephones }}"
      sequence:
        - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
          continue_on_error: true
          data:
            title: Météo du jour
            message: "{{ texte }}"
            data:
              tag: hestia_weather_bulletin
  - repeat:
      for_each: "{{ notifier }}"
      sequence:
        - action: "{{ repeat.item }}"
          continue_on_error: true
          data:
            title: Météo du jour
            message: "{{ texte }}"
            data:
              tag: hestia_weather_bulletin
  - if:
      - condition: template
        value_template: "{{ enceintes | count > 0 and voix != '' }}"
    then:
      - action: tts.speak
        continue_on_error: true
        target:
          entity_id: "{{ voix }}"
        data:
          media_player_entity_id: "{{ enceintes }}"
          message: "{{ texte }}"
  - choose: []
    default: !input en_plus
