blueprint:
  name: Hestia Weather · Notifier les alertes
  description: >-
    Un message quand une alerte Hestia Weather commence, change de niveau ou se termine :
    vigilance Météo-France, orage, vent fort, pluie forte, gel, risque de neige ou de verglas, canicule, UV.
    Toute la météo est calculée par Hestia Weather ; cette automatisation ne fait que transmettre.
    Le message de fin remplace celui du début sur le téléphone.
  domain: automation
  source_url: https://github.com/hestiaFB/hestia-weather-integration/blob/main/blueprints/automation/hestia_weather/notifier_alertes.yaml
  homeassistant:
    min_version: "2025.1.0"
  input:
    alertes:
      name: Alertes à transmettre
      default: [vigilance, orage, vent_fort, pluie_forte, gel, neige, verglas, canicule, uv_fort]
      selector:
        select:
          multiple: true
          options:
            - { value: vigilance, label: Vigilance Météo-France }
            - { value: orage, label: Orage }
            - { value: vent_fort, label: Vent fort }
            - { value: pluie_forte, label: Pluie forte }
            - { value: gel, label: Gel }
            - { value: neige, label: Risque de neige }
            - { value: verglas, label: Risque de verglas }
            - { value: canicule, label: Canicule }
            - { value: uv_fort, label: UV forts }
    niveau:
      name: À partir de
      description: Une vigilance jaune ou une alerte à surveiller vaut 1, orange ou sérieuse 2, rouge 3.
      default: "1"
      selector:
        select:
          options:
            - { value: "1", label: Tout (jaune et plus) }
            - { value: "2", label: Sérieux (orange et plus) }
            - { value: "3", label: Vigilance rouge seulement }
    fins:
      name: Prévenir aussi quand c’est fini
      default: true
      selector:
        boolean:
    telephones:
      name: Téléphones
      description: Les téléphones qui ont l’application Home Assistant.
      default: []
      selector:
        device:
          multiple: true
          filter:
            - integration: mobile_app
    enceintes:
      name: Enceintes (facultatif)
      description: Le message y est lu à voix haute, avec la voix choisie juste en dessous.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: media_player
    voix:
      name: Voix des enceintes
      description: Par exemple « Google Translate » ou « Home Assistant Cloud ».
      default: ""
      selector:
        entity:
          filter:
            - domain: tts
    annonces_debut:
      name: Annonces vocales à partir de
      description: Hors de ces heures, les enceintes se taisent ; les téléphones sont toujours prévenus.
      default: "08:00:00"
      selector:
        time:
    annonces_fin:
      name: Annonces vocales jusqu’à
      default: "21:30:00"
      selector:
        time:
    notifier:
      name: Autres notifications (facultatif)
      description: Un groupe comme notify.famille, à taper ; vos réglages d’avant sont gardés ici.
      default: []
      selector:
        text:
          multiple: true
    en_plus:
      name: Autres actions (facultatif)
      description: >-
        Ce que vous voulez faire en plus : annonce vocale, lumière… Les variables titre, texte, type, etat et niveau sont disponibles.
      default: []
      selector:
        action:

mode: queued
max: 10

triggers:
  - trigger: event
    event_type: hestia_weather_alerte

variables:
  alertes: !input alertes
  niveau_min: !input niveau
  fins: !input fins
  notifier: !input notifier
  telephones: !input telephones
  enceintes: !input enceintes
  voix: !input voix
  annonces_debut: !input annonces_debut
  annonces_fin: !input annonces_fin
  calme_ok: >-
    {% set d, f, n = today_at(annonces_debut), today_at(annonces_fin), now() %}
    {{ (d <= n < f) if d <= f else (n >= d or n < f) }}
  type: "{{ trigger.event.data.type }}"
  etat: "{{ trigger.event.data.etat }}"
  niveau: "{{ trigger.event.data.niveau | int(0) }}"
  texte: "{{ trigger.event.data.texte }}"
  noms:
    vigilance: Vigilance Météo-France
    orage: Orage
    vent_fort: Vent fort
    pluie_forte: Pluie forte
    gel: Gel
    neige: Risque de neige
    verglas: Risque de verglas
    canicule: Canicule
    uv_fort: UV forts
  titre: "{{ 'Météo' if etat == 'fin' else noms.get(type, 'Météo') }}"

conditions:
  - condition: template
    value_template: "{{ type in alertes and niveau >= niveau_min | int(1) and (etat != 'fin' or fins) }}"

actions:
  - repeat:
      for_each: "{{ telephones }}"
      sequence:
        - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
          continue_on_error: true
          data:
            title: "{{ titre }}"
            message: "{{ texte }}"
            data:
              tag: "hestia_weather_{{ type }}"
  - repeat:
      for_each: "{{ notifier }}"
      sequence:
        - action: "{{ repeat.item }}"
          continue_on_error: true
          data:
            title: "{{ titre }}"
            message: "{{ texte }}"
            data:
              tag: "hestia_weather_{{ type }}"
  - if:
      - condition: template
        value_template: "{{ enceintes | count > 0 and voix != '' and calme_ok }}"
    then:
      - action: tts.speak
        continue_on_error: true
        target:
          entity_id: "{{ voix }}"
        data:
          media_player_entity_id: "{{ enceintes }}"
          message: "{{ texte }}"
  - choose: []
    default: !input en_plus
